# GoReleaser v2 configuration — https://goreleaser.com
# Build, archive, checksum, and publish a Homebrew formula on tag push.
version: 2

project_name: wayfarer

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }} -X main.date={{ .CommitDate }}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

brews:
  - repository:
      owner: TimboGP
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/TimboGP/git-wayfarer"
    description: "Interactive terminal UI for walking git history, switching branches/worktrees, and inspecting diffs"
    license: "MIT"
    # delta is optional but recommended for nicer diffs.
    dependencies:
      - name: git
      - name: git-delta
        type: optional
    install: |
      bin.install "wayfarer"
    test: |
      system "#{bin}/wayfarer", "--version"
